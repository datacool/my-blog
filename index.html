<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="site-title">My Blog</a>
      <button id="theme-toggle" aria-label="다크 모드로 전환">🌙</button>
    </div>
  </header>

  <main>
    <h2 class="section-heading">Posts</h2>
    <div id="post-list"></div>

    <section class="apps-section">
      <h2 class="section-heading">Mini Apps</h2>
      <div class="app-cards">
        <a class="app-card" href="apps/pixel-art/index.html">
          <div class="app-card-icon">🎨</div>
          <div class="app-card-body">
            <h3 class="app-card-title">Pixel Art Editor</h3>
            <p class="app-card-desc">16×16 격자에 도트를 찍어 픽셀 아트를 그리고 PNG로 저장하는 에디터. 펜·지우개·채우기·스포이트 도구와 32색 팔레트 제공.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 My Blog</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
